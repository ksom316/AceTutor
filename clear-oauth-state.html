<!DOCTYPE html>
<html>
<head>
    <title>Clear OAuth State - AceTutor</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-top: 0; }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover { background: #4f46e5; }
        .success { color: #10b981; margin-top: 20px; }
        .info { color: #6366f1; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔄 Clear OAuth State</h1>
        <p>This will clear all Supabase authentication state and fix OAuth errors.</p>
        <button onclick="clearState()">Clear OAuth State</button>
        <div id="result"></div>
        <div class="info">
            After clearing, you'll be redirected to the login page.
        </div>
    </div>

    <script>
        function clearState() {
            const result = document.getElementById('result');

            // Clear all Supabase-related localStorage items
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && (key.includes('supabase') || key.includes('auth'))) {
                    keysToRemove.push(key);
                }
            }

            keysToRemove.forEach(key => localStorage.removeItem(key));

            // Clear session storage too
            sessionStorage.clear();

            result.innerHTML = '<div class="success">✅ OAuth state cleared successfully!</div>';

            setTimeout(() => {
                window.location.href = 'http://localhost:8080/login';
            }, 1500);
        }
    </script>
</body>
</html>
